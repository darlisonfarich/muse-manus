name: Temporary GER PR7 golden refresh (read-only)
on:
  push:
    branches: [fix/ger-pr7-snapshot-regenerator]
permissions:
  contents: read
jobs:
  refresh:
    name: regenerate goldens without modifying remote branches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: CI Gradle distribution (official SHA-256 pinned)
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://mirrors.aliyun.com/gradle/distributions/v8.11.1/gradle-8.11.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
      - name: Bootstrap checksum-verified Kotlin compiler
        run: bash tools/ci/bootstrap-kotlin-compiler.sh
      - name: Generate only existing golden snapshots
        run: ./gradlew :core:test --tests '*LoopScenarioTest' --tests '*PromptSurfaceTest' -PupdateSnapshots --stacktrace
      - name: Export generated snapshot contents for review (no secrets)
        run: |
          python3 - <<'PY'
          import base64,subprocess,pathlib
          paths=subprocess.check_output(["git","diff","--name-only","--","core/src/test/resources/loop-snapshots","core/src/test/resources/prompt-surface"],text=True).splitlines()
          print("MUSE_GOLDENS_COUNT",len(paths),flush=True)
          for path in paths:
              if not path.startswith(("core/src/test/resources/loop-snapshots/","core/src/test/resources/prompt-surface/")): raise ValueError("unsafe path")
              raw=pathlib.Path(path).read_bytes()
              print("MUSE_GOLDEN_START",base64.b64encode(path.encode()).decode(),flush=True)
              encoded=base64.b64encode(raw).decode()
              for offset in range(0,len(encoded),2048):print("MUSE_GOLDEN_DATA",encoded[offset:offset+2048],flush=True)
              print("MUSE_GOLDEN_END",flush=True)
          print("MUSE_GOLDENS_FINISHED",flush=True)
          PY
      - name: Diagnostic for budget assertion (does not write fixtures)
        continue-on-error: true
        run: |
          ./gradlew :core:test --tests '*AgentLoopTest.longTaskStaysUnderBudget' --stacktrace || true
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('core/build/test-results/test').glob('TEST-*.xml'):
              root=ET.parse(path).getroot()
              for test in root.iter('testcase'):
                  if 'longTaskStaysUnderBudget' not in test.get('name',''):continue
                  for f in test.findall('failure'):
                      print('MUSE_BUDGET_FAILURE',f.attrib.get('message','')[:1500],flush=True)
          PY
